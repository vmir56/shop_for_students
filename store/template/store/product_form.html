{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container">
    <h2>{{ title }}</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <!-- Добавил изображение -->
        {% if form.instance.image %}
            <div class="current-image">
                <label>Текущее изображение:</label>
                <div>
                    <img src="{{ form.instance.image.url }}" alt="Текущее фото" style="max-width: 200px; border-radius: 8px;">
                </div>
            </div>
        {% endif %}

        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}:</label>
                {{ field }}
                {% if field.errors %}
                    <div class="error">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'store:product_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
