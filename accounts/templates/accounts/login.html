

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Вход в систему</h2>
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Имя пользователя:</label>
            {{ form.username }}
        </div>
        
        <div class="form-group">
            <label>Пароль:</label>
            {{ form.password }}
        </div>
        
        <button type="submit" class="btn btn-primary">Войти</button>
    </form>
    
    <p class="auth-link">
        Нет аккаунта? <a href="{% url 'accounts:register' %}">Зарегистрироваться</a>
    </p>
</div>

<style>
    .auth-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-control {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
    }
    
    .btn-primary {
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    
    .auth-link {
        text-align: center;
        margin-top: 20px;
    }
</style>
{% endblock %}
